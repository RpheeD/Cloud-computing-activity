<!DOCTYPE html>
<html>
<head>
<title>Upload File to GitHub</title>

<style>

body{
font-family: Arial, Helvetica, sans-serif;
background:#d9fdd3; /* Light green background */
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.container{
background:white;
padding:40px;
border-radius:10px;
box-shadow:0px 5px 15px rgba(0,0,0,0.1);
text-align:center;
width:350px;
}

h2{
margin-bottom:20px;
color:#333;
}

input[type=file]{
margin-bottom:20px;
}

button{
background:#2ea44f;
border:none;
padding:10px 20px;
color:white;
font-size:16px;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#218838;
}

.status{
margin-top:15px;
color:#555;
}

</style>

</head>

<body>

<div class="container">

<h2>Upload File to GitHub</h2>

<input type="file" id="fileInput">

<br>

<button onclick="uploadFile()">Upload File</button>

<div class="status" id="status"></div>

</div>

<script>

async function uploadFile(){

const file = document.getElementById("fileInput").files[0];

if(!file){
alert("Please select a file first.");
return;
}

const reader = new FileReader();

reader.onload = async function(e){

const content = e.target.result.split(',')[1];

// Your GitHub details
const username = "RpheeD";
const repo = "Cloud-computing-activity";
const token = "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";

const api = `https://api.github.com/repos/${username}/${repo}/contents/${file.name}`;

const data = {
message:"Uploading file via Cloud Computing activity",
content:content
};

try{

const response = await fetch(api,{
method:"PUT",
headers:{
"Authorization":`token ${token}`,
"Content-Type":"application/json"
},
body:JSON.stringify(data)
});

const result = await response.json();

if(response.ok){
document.getElementById("status").innerHTML="✅ File uploaded successfully!";
console.log(result);
}else{
document.getElementById("status").innerHTML="❌ Upload failed: " + result.message;
console.log(result);
}

}catch(err){

document.getElementById("status").innerHTML="❌ Upload failed.";
console.error(err);

}

};

reader.readAsDataURL(file);

}

</script>

</body>
</html>
